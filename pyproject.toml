[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skullify"
version = "0.2.4"
description = "A green-on-black Spotify CLI/TUI with an animated ASCII header and audio visualizer."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jeremy" }]
keywords = ["spotify", "cli", "tui", "music", "visualizer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
  "spotipy>=2.23,<3",
  "requests>=2.31",
  "numpy>=1.26",
  "sounddevice>=0.4.6",
]

[project.urls]
Homepage = "https://github.com/Slaps-Art/skullify"
Issues = "https://github.com/Slaps-Art/skullify/issues"

[project.scripts]
skullify = "skullify.cli:run_entrypoint"

[tool.setuptools.packages.find]
include = ["skullify*"]

[tool.setuptools.package-data]
skullify = ["jellyfish_ascii.js", "ascii/*.json"]
